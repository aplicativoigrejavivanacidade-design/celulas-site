<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>+Células | Usuários</title>

  <style>
    * { box-sizing: border-box; }

    :root{
      --bg:#eef2f7;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#dbe3ee;
      --blue:#2563eb;
      --blue-dark:#1d4ed8;
      --green:#16a34a;
      --green-dark:#15803d;
      --amber:#f59e0b;
      --red:#dc2626;
      --red-dark:#b91c1c;
      --gray:#64748b;
      --gray-dark:#475569;
      --shadow:0 10px 25px rgba(0,0,0,0.05);
      --radius:16px;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .layout{display:flex;min-height:100vh;}

    .sidebar{
      width:250px;
      background:linear-gradient(180deg,var(--blue-dark),var(--green));
      color:#fff;
      padding:24px 18px;
      position:fixed;
      top:0;
      left:0;
      height:100%;
    }

    .logo{font-size:30px;font-weight:bold;margin:0;}
    .logo-sub{margin:6px 0 28px;font-size:13px;opacity:.9;}

    .menu a{
      display:block;
      color:#fff;
      padding:12px;
      text-decoration:none;
      border-radius:10px;
      margin-bottom:6px;
      font-weight:bold;
    }

    .menu a:hover,.menu a.ativo{background:rgba(255,255,255,.16);}

    .btn-sair{
      margin-top:20px;
      width:100%;
      padding:12px;
      border:none;
      border-radius:12px;
      background:var(--red);
      color:#fff;
      font-weight:bold;
      cursor:pointer;
    }

    .content{
      margin-left:250px;
      padding:30px;
      width:calc(100% - 250px);
    }

    .header,.card{
      background:var(--card);
      padding:22px;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }

    .header{margin-bottom:20px;}
    .header h1{margin:0 0 8px;font-size:30px;}
    .header p{margin:0;color:var(--muted);}
    .usuario-logado{margin-top:10px!important;font-size:14px;}

    .grid-2{
      display:grid;
      grid-template-columns:1fr 1.15fr;
      gap:20px;
      align-items:start;
    }

    label{
      display:block;
      margin-top:12px;
      margin-bottom:6px;
      font-weight:bold;
      font-size:14px;
    }

    input,select{
      width:100%;
      padding:12px;
      border-radius:10px;
      border:1px solid var(--line);
      font-size:15px;
      background:#fff;
    }

    input:focus,select:focus{
      outline:none;
      border-color:var(--blue);
      box-shadow:0 0 0 3px rgba(37,99,235,.12);
    }

    input[type="text"]{text-transform:uppercase;}

    .acoes{
      display:flex;
      gap:10px;
      margin-top:16px;
      flex-wrap:wrap;
    }

    button{
      padding:12px 14px;
      border:none;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
      font-size:14px;
    }

    button:disabled{opacity:.6;cursor:not-allowed;}
    .btn-primario{background:var(--blue);color:#fff;}
    .btn-primario:hover{background:var(--blue-dark);}
    .btn-sucesso{background:var(--green);color:#fff;}
    .btn-sucesso:hover{background:var(--green-dark);}
    .btn-aviso{background:var(--amber);color:#fff;}
    .btn-secundario{background:var(--gray);color:#fff;}
    .btn-secundario:hover{background:var(--gray-dark);}
    .btn-perigo{background:var(--red);color:#fff;}
    .btn-perigo:hover{background:var(--red-dark);}

    .status-edicao{
      margin-top:14px;
      padding:12px;
      border-radius:12px;
      font-size:13px;
      font-weight:bold;
      background:#eff6ff;
      color:#1d4ed8;
    }

    .item{
      border:1px solid var(--line);
      border-radius:12px;
      padding:14px;
      margin-bottom:10px;
      background:#fafbfd;
      cursor:pointer;
    }

    .item:hover,.item.ativo{
      border-color:var(--blue);
      box-shadow:0 0 0 3px rgba(37,99,235,.10);
    }

    .item h3{margin:0 0 8px;font-size:17px;}
    .item p{margin:0 0 5px;color:#4b5563;font-size:13px;}

    .badge{
      display:inline-block;
      padding:8px 12px;
      border-radius:999px;
      font-size:13px;
      font-weight:bold;
      background:#e8f0ff;
      color:var(--blue-dark);
    }

    .msg{margin-top:14px;font-weight:bold;min-height:20px;font-size:14px;}
    .vazio{color:var(--muted);font-style:italic;text-align:center;padding:20px;border:2px dashed var(--line);border-radius:12px;background:#fcfdff;}

    @media(max-width:1000px){.grid-2{grid-template-columns:1fr;}}
    @media(max-width:900px){
      .layout{flex-direction:column;}
      .sidebar{position:relative;width:100%;height:auto;}
      .content{margin-left:0;width:100%;padding:20px;}
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h2 class="logo">+Células</h2>
    <div class="logo-sub">Gestão de células</div>

    <div class="menu">
      <a href="painel.html">Painel</a>
      <a href="cadastro.html">Membros</a>
      <a href="presenca.html">Presença</a>
      <a href="celulas.html">Células</a>
      <a href="relatorios.html">Relatórios</a>
      <a href="usuarios.html" class="ativo">Usuários</a>
    </div>

    <button class="btn-sair" id="btnSair" type="button">Sair</button>
  </aside>

  <main class="content">
    <div class="header">
      <h1>Usuários</h1>
      <p>Gestão de usuários, níveis de acesso e vínculo com célula</p>
      <p id="usuarioLogado" class="usuario-logado"></p>
    </div>

    <div class="grid-2">
      <div class="card">
        <h2>Dados do usuário</h2>

        <input id="usuarioId" type="hidden">

        <div class="status-edicao" id="statusEdicao">
          Modo atual: Novo cadastro.
        </div>

        <label for="seletorUsuario">Selecionar usuário para editar</label>
        <select id="seletorUsuario">
          <option value="">Novo usuário</option>
        </select>

        <label for="nome">Nome</label>
        <input id="nome" type="text" placeholder="Nome completo">

        <label for="usuario">Usuário</label>
        <input id="usuario" type="text" placeholder="Login de acesso">

        <label for="senha">Senha</label>
        <input id="senha" type="text" placeholder="Senha de acesso">

        <label for="nivel">Nível</label>
        <select id="nivel">
          <option value="ADMIN">ADMIN</option>
          <option value="SUPERVISOR">SUPERVISOR</option>
          <option value="LIDER">LÍDER</option>
        </select>

        <label for="celulaUsuario">Célula vinculada</label>
        <select id="celulaUsuario">
          <option value="">Sem vínculo / acesso geral</option>
        </select>

        <div class="acoes">
          <button id="btnSalvar" class="btn-primario" type="button">Salvar usuário</button>
          <button id="btnNovo" class="btn-aviso" type="button">Novo usuário</button>
          <button id="btnCancelar" class="btn-secundario" type="button" disabled>Cancelar edição</button>
        </div>

        <div id="msg" class="msg"></div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;">
          <h2 style="margin:0;">Lista de usuários</h2>
          <span class="badge" id="contador">0 usuário(s)</span>
        </div>

        <div id="listaUsuarios"></div>
      </div>
    </div>
  </main>
</div>

<script>
const API = "https://celulas-backend.onrender.com";
let usuarios = [];
let celulas = [];
let usuarioAtual = null;

const campoUsuarioLogado = document.getElementById("usuarioLogado");
const seletorUsuario = document.getElementById("seletorUsuario");
const campoId = document.getElementById("usuarioId");
const campoNome = document.getElementById("nome");
const campoUsuario = document.getElementById("usuario");
const campoSenha = document.getElementById("senha");
const campoNivel = document.getElementById("nivel");
const campoCelulaUsuario = document.getElementById("celulaUsuario");
const campoMsg = document.getElementById("msg");
const campoStatusEdicao = document.getElementById("statusEdicao");
const listaUsuarios = document.getElementById("listaUsuarios");
const contador = document.getElementById("contador");
const btnCancelar = document.getElementById("btnCancelar");

if(localStorage.getItem("logado") !== "sim"){
  window.location.href = "login.html";
}

if(String(localStorage.getItem("nivelUsuario") || "").toLowerCase() !== "admin"){
  alert("Apenas administradores podem acessar a gestão de usuários.");
  window.location.href = "painel.html";
}

campoUsuarioLogado.textContent = `Usuário: ${localStorage.getItem("nomeUsuario") || "Administrador"}`;

document.getElementById("btnSair").onclick = function(){
  localStorage.clear();
  window.location.href = "login.html";
};

function normalizarTexto(valor){
  return String(valor || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, " ")
    .trim()
    .toUpperCase();
}

function normalizarNomeCelula(valor){
  return normalizarTexto(valor).replace(/^CELULA\s*/i, "").trim();
}

function nomeCelulaExibicao(valor){
  const base = normalizarNomeCelula(valor);
  return base ? `CÉLULA ${base}` : "";
}

function mostrarMensagem(texto, cor="#dc2626"){
  campoMsg.textContent = texto;
  campoMsg.style.color = cor;
}

function limparMensagem(){
  campoMsg.textContent = "";
}

function atualizarStatusEdicao(){
  if(campoId.value){
    campoStatusEdicao.textContent = "Modo atual: Editando usuário selecionado.";
    campoStatusEdicao.style.background = "#ecfdf5";
    campoStatusEdicao.style.color = "#166534";
    btnCancelar.disabled = false;
  }else{
    campoStatusEdicao.textContent = "Modo atual: Novo cadastro.";
    campoStatusEdicao.style.background = "#eff6ff";
    campoStatusEdicao.style.color = "#1d4ed8";
    btnCancelar.disabled = true;
  }
}

function limpar(){
  campoId.value = "";
  campoNome.value = "";
  campoUsuario.value = "";
  campoSenha.value = "";
  campoNivel.value = "ADMIN";
  campoCelulaUsuario.value = "";
  seletorUsuario.value = "";
  usuarioAtual = null;
  atualizarRegraCelulaUsuario();
  atualizarStatusEdicao();
  limparMensagem();
  renderizarListaUsuarios();
}

function preencherFormulario(usuario){
  usuarioAtual = {...usuario};
  campoId.value = usuario.id || "";
  campoNome.value = usuario.nome || "";
  campoUsuario.value = usuario.usuario || "";
  campoSenha.value = usuario.senha || "";
  campoNivel.value = String(usuario.nivel || "ADMIN").toUpperCase();
  campoCelulaUsuario.value = nomeCelulaExibicao(usuario.celula || "");
  seletorUsuario.value = String(usuario.id || "");
  atualizarRegraCelulaUsuario();
  atualizarStatusEdicao();
  limparMensagem();
  renderizarListaUsuarios();
}

async function carregarCelulas(){
  try{
    const resp = await fetch(API + "/celulas",{cache:"no-store"});
    if(!resp.ok) throw new Error("Erro ao carregar células.");

    celulas = await resp.json();

    const opcoes = celulas
      .filter(c => c.ativo !== false)
      .sort((a,b) => String(a.nome || "").localeCompare(String(b.nome || ""), "pt-BR"))
      .map(c => `<option value="${c.nome}">${c.nome}</option>`)
      .join("");

    campoCelulaUsuario.innerHTML = '<option value="">Sem vínculo / acesso geral</option>' + opcoes;
  }catch(erro){
    console.error(erro);
    campoCelulaUsuario.innerHTML = '<option value="">Erro ao carregar células</option>';
    mostrarMensagem("Erro ao carregar células para vínculo.");
  }
}

function atualizarRegraCelulaUsuario(){
  const nivel = String(campoNivel.value || "").toUpperCase();

  if(nivel === "LIDER"){
    campoCelulaUsuario.disabled = false;
  }else{
    campoCelulaUsuario.value = "";
    campoCelulaUsuario.disabled = true;
  }
}

function renderizarSeletorUsuarios(){
  seletorUsuario.innerHTML = '<option value="">Novo usuário</option>' +
    [...usuarios]
      .sort((a,b) => String(a.nome || "").localeCompare(String(b.nome || ""), "pt-BR"))
      .map(u => `<option value="${u.id}">${u.nome || u.usuario} - ${String(u.nivel || "").toUpperCase()}</option>`)
      .join("");

  if(campoId.value){
    seletorUsuario.value = campoId.value;
  }
}

function renderizarListaUsuarios(){
  contador.textContent = `${usuarios.length} usuário(s)`;

  if(!usuarios.length){
    listaUsuarios.innerHTML = '<div class="vazio">Nenhum usuário cadastrado.</div>';
    return;
  }

  listaUsuarios.innerHTML = [...usuarios]
    .sort((a,b) => String(a.nome || "").localeCompare(String(b.nome || ""), "pt-BR"))
    .map(u => `
      <div class="item ${String(u.id) === String(campoId.value) ? "ativo" : ""}" onclick="editarUsuario(${u.id})">
        <h3>${u.nome || ""}</h3>
        <p><strong>Usuário:</strong> ${u.usuario || "-"}</p>
        <p><strong>Nível:</strong> ${String(u.nivel || "").toUpperCase()}</p>
        <p><strong>Célula vinculada:</strong> ${u.celula || "ACESSO GERAL"}</p>
        <div class="acoes">
          <button class="btn-primario" type="button" onclick="event.stopPropagation(); editarUsuario(${u.id})">Editar</button>
          <button class="btn-perigo" type="button" onclick="event.stopPropagation(); excluirUsuario(${u.id})">Excluir</button>
        </div>
      </div>
    `).join("");
}

async function carregarUsuarios(){
  try{
    const resp = await fetch(API + "/usuarios",{cache:"no-store"});
    if(!resp.ok) throw new Error("Erro ao carregar usuários.");

    usuarios = await resp.json();
    renderizarSeletorUsuarios();
    renderizarListaUsuarios();
  }catch(erro){
    console.error(erro);
    listaUsuarios.innerHTML = '<div class="vazio">Erro ao carregar usuários.</div>';
    mostrarMensagem("Erro ao carregar usuários.");
  }
}

window.editarUsuario = function(id){
  const usuario = usuarios.find(x => Number(x.id) === Number(id));
  if(!usuario) return;
  preencherFormulario(usuario);
};

window.excluirUsuario = async function(id){
  const usuario = usuarios.find(x => Number(x.id) === Number(id));
  const nome = usuario?.nome || "este usuário";

  if(String(usuario?.usuario || "").toLowerCase() === "admin"){
    mostrarMensagem("O usuário admin não pode ser excluído.");
    return;
  }

  const confirmou = confirm(`Deseja realmente excluir ${nome}?`);
  if(!confirmou) return;

  try{
    const resp = await fetch(API + "/usuarios/" + id,{method:"DELETE"});
    const dados = await resp.json().catch(() => ({}));

    if(!resp.ok){
      throw new Error(dados.erro || "Erro ao excluir usuário.");
    }

    mostrarMensagem("Usuário excluído com sucesso!", "#16a34a");
    limpar();
    await carregarUsuarios();
  }catch(erro){
    mostrarMensagem(erro.message || "Erro ao excluir usuário.");
  }
};

async function salvarUsuario(){
  const id = campoId.value;

  const dados = {
    nome: campoNome.value.trim(),
    usuario: campoUsuario.value.trim().toLowerCase(),
    senha: campoSenha.value.trim(),
    nivel: campoNivel.value,
    celula: campoCelulaUsuario.value
  };

  if(!dados.nome || !dados.usuario || !dados.senha){
    mostrarMensagem("Preencha nome, usuário e senha.");
    return;
  }

  if(dados.nivel === "LIDER" && !dados.celula){
    mostrarMensagem("Selecione a célula vinculada para o líder.");
    return;
  }

  try{
    const resp = await fetch(API + (id ? "/usuarios/" + id : "/usuarios"),{
      method:id ? "PUT" : "POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(dados)
    });

    const retorno = await resp.json().catch(() => ({}));

    if(!resp.ok){
      throw new Error(retorno.erro || "Erro ao salvar usuário.");
    }

    mostrarMensagem("Usuário salvo com sucesso!", "#16a34a");
    await carregarUsuarios();

    const salvo = usuarios.find(u => String(u.usuario || "").toLowerCase() === dados.usuario);
    if(salvo){
      preencherFormulario(salvo);
    }else{
      limpar();
    }
  }catch(erro){
    mostrarMensagem(erro.message || "Erro ao salvar usuário.");
  }
}

seletorUsuario.addEventListener("change", () => {
  const id = seletorUsuario.value;
  if(!id){
    limpar();
    return;
  }

  editarUsuario(id);
});

document.getElementById("btnNovo").onclick = limpar;
document.getElementById("btnCancelar").onclick = function(){
  if(usuarioAtual){
    preencherFormulario(usuarioAtual);
    mostrarMensagem("Edição cancelada. Dados restaurados.", "#64748b");
  }else{
    limpar();
  }
};
document.getElementById("btnSalvar").onclick = salvarUsuario;
campoNivel.addEventListener("change", atualizarRegraCelulaUsuario);

carregarCelulas().then(() => {
  atualizarRegraCelulaUsuario();
  carregarUsuarios();
});
</script>
</body>
</html>
